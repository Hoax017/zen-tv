name: Build & release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Check scripts
        run: bash -n zen.sh

      - name: Release signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ZEN_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ZEN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK and zip
        env:
          ZEN_KEYSTORE_PASS: ${{ secrets.ZEN_KEYSTORE_PASS }}
          ZEN_KEY_ALIAS: ${{ secrets.ZEN_KEY_ALIAS }}
          ZEN_KEY_PASS: ${{ secrets.ZEN_KEY_PASS }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export ZEN_VERSION="${GITHUB_REF_NAME#v}"
            export ZEN_VERSION_CODE="$GITHUB_RUN_NUMBER"
          fi
          ./launcher/build.sh
          ./tools/make-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: zen-tv
          path: dist/zen-tv.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zen-tv.zip
            dist/zen-home.apk
